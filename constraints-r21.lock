# R21 dependency lock — HD2Lab Document Intelligence Service (AGPilot0006)
#
# Scope: exact versions the R21 knowledge engine was implemented and tested against.
# Use:   python3 -m pip install -r requirements.txt -c constraints-r21.lock
#        python3 -m pip install -r requirements-optional.txt -c constraints-r21.lock
#
# Generation environment (recorded, not guessed):
#   CPython 3.12.16 / Linux x86_64 (sandbox) — R21 pre-development test host
#   Deployment reference from Server-HQ WO-R2-CLOSE: CPython 3.11.2, AGTools build
#   `budget-search-20261124-r1`, source 6d0f57f, PyMuPDF + pymupdf4llm 2.1, Pillow 9.4.0.
#
# Compatibility policy
#   * Pure-Python and manylinux/macosx/win wheels are pinned exactly; they are the same
#     version on Linux x86_64, Linux ARM64 (Raspberry Pi OS 64-bit), Windows and macOS.
#   * Packages with a compiled core (PyMuPDF, pydantic-core, lxml, Pillow) are pinned to a
#     version that ships all four wheel families. If a platform has no wheel, pip builds from
#     source; the ARM64 build needs `build-essential libffi-dev python3-dev` (documented in
#     docs/r21/DEPENDENCY_LOCK.md) and is not claimed as tested here.
#   * `pytesseract` is an optional wrapper only; the OCR capability also needs the host
#     `tesseract` binary, which pip cannot install. The manifest reports OCR unavailable
#     instead of pretending it works.
#
# Update procedure: bump here, rerun `python3 -m pytest -q`, record the new host/Python in
# docs/r21/DEPENDENCY_LOCK.md, and keep the previous pin set in that doc's history table.

